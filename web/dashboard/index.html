<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinMan</title>
<link rel="icon" type="image/png" href="finman-mark.png">
<link rel="apple-touch-icon" href="finman-mark.png">
<meta name="description" content="Portafoglio di esempio, articoli MF e prezzi da dataset, interpretazioni del modello. Non è consulenza finanziaria.">
<style>
/* Estetica ispirata alle app Apple: font di sistema, superfici chiare, separatori sottili. Segue il tema del dispositivo. */
:root {
  --bg: #f2f2f5;
  --side: #fafafc;
  --card: #ffffff;
  --card-2: #f5f5f7;
  --sep: rgba(0, 0, 0, .09);
  --sep-strong: rgba(0, 0, 0, .14);
  --fill: rgba(118, 118, 128, .12);
  --fill-2: rgba(118, 118, 128, .08);
  --sel: rgba(0, 0, 0, .065);
  --seg-on: #ffffff;
  --ink: #1d1d1f;
  --ink-2: #6e6e73;
  --ink-3: #737378;
  --accent: #0071e3;
  --accent-soft: rgba(0, 113, 227, .1);
  --up: #1f8a3b;
  --down: #d70015;
  --warn: #b25000;
  --up-soft: rgba(52, 199, 89, .14);
  --down-soft: rgba(255, 59, 48, .1);
  --warn-soft: rgba(255, 149, 0, .15);
  --pill-up: #248a3d;
  --pill-down: #d70015;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 0 0 .5px rgba(0, 0, 0, .04);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #4a3aa7; --s-other: #a1a1a6;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --r: 14px;
  --left-w: 320px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #000000; --side: #161618; --card: #1c1c1e; --card-2: #2c2c2e;
    --sep: rgba(255, 255, 255, .1); --sep-strong: rgba(255, 255, 255, .16);
    --fill: rgba(118, 118, 128, .24); --fill-2: rgba(118, 118, 128, .16); --sel: rgba(255, 255, 255, .1); --seg-on: #636366;
    --ink: #f5f5f7; --ink-2: #a1a1a6; --ink-3: #8e8e93;
    --accent: #2997ff; --accent-soft: rgba(41, 151, 255, .16);
    --up: #30d158; --down: #ff453a; --warn: #ff9f0a;
    --up-soft: rgba(48, 209, 88, .16); --down-soft: rgba(255, 69, 58, .16); --warn-soft: rgba(255, 159, 10, .16);
    --shadow: none;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #9085e9; --s-other: #636366;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000; --side: #161618; --card: #1c1c1e; --card-2: #2c2c2e;
  --sep: rgba(255, 255, 255, .1); --sep-strong: rgba(255, 255, 255, .16);
  --fill: rgba(118, 118, 128, .24); --fill-2: rgba(118, 118, 128, .16); --sel: rgba(255, 255, 255, .1); --seg-on: #636366;
  --ink: #f5f5f7; --ink-2: #a1a1a6; --ink-3: #8e8e93;
  --accent: #2997ff; --accent-soft: rgba(41, 151, 255, .16);
  --up: #30d158; --down: #ff453a; --warn: #ff9f0a;
  --up-soft: rgba(48, 209, 88, .16); --down-soft: rgba(255, 69, 58, .16); --warn-soft: rgba(255, 159, 10, .16);
  --shadow: none;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #9085e9; --s-other: #636366;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; letter-spacing: -.01em; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px; border-radius: 8px; }
[tabindex="-1"]:focus { outline: none; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------------------------------------------------------------- struttura */
.shell { display: grid; grid-template-columns: var(--left-w) minmax(0, 1fr); grid-template-areas: "left main"; min-height: 100vh; }
.side { background: var(--side); position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--sep-strong) transparent; }
.side-left { grid-area: left; border-right: 1px solid var(--sep); min-width: 0; overflow-x: hidden; }
/* il contenuto tiene la larghezza della colonna anche mentre si chiude, così non si riorganizza durante l'animazione */
.side-left .side-inner { width: calc(var(--left-w) - 1px); container: side / inline-size; transition: opacity 180ms ease; }
.shell.side-closed { grid-template-columns: 0px minmax(0, 1fr); }
.shell.side-closed .side-left { visibility: hidden; border-right-color: transparent; transition: visibility 0s linear 300ms; }
.shell.side-closed .side-left .side-inner { opacity: 0; transition-duration: 120ms; }
.shell.side-closed .splitter { display: none; }
.side-tabs { display: flex; }
.side-tabs button { flex: 1; }

/* divisore trascinabile tra portafoglio e notizie */
.splitter { position: fixed; top: 0; bottom: 0; left: calc(var(--left-w) - 5px); width: 10px; z-index: 25; cursor: col-resize; touch-action: none; outline: none; }
.splitter::after { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 2px; border-radius: 1px; background: transparent; transition: background-color 150ms ease; }
@media (hover: hover) and (pointer: fine) { .splitter:hover::after { background: var(--sep-strong); transition-delay: 120ms; } }
.splitter:focus-visible::after, body.resizing .splitter::after { background: var(--accent); transition-delay: 0ms; }
body.resizing { cursor: col-resize; user-select: none; -webkit-user-select: none; }
.shell.resizing { transition: none; }
/* la colonna mostra di più quando è più larga */
@container side (min-width: 430px) {
  .side-left .sym { grid-template-columns: minmax(0, 1fr) minmax(56px, 1.1fr) 84px; gap: 14px; }
  .side-left .spark { width: 100%; }
}
.shell { transition: grid-template-columns 300ms var(--ease-drawer, cubic-bezier(0.32, 0.72, 0, 1)); }
.main { grid-area: main; min-width: 0; container-type: inline-size; outline: none; }
.side-inner { padding: 14px 12px 24px; display: grid; gap: 18px; align-content: start; }

/* ---------------------------------------------------------------- barra laterale */
/* marchio: tessera bianca arrotondata stile icona d'app, così il fondo bianco del disegno è voluto anche in tema scuro */
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px; text-decoration: none; color: var(--ink); }
.brand-mark { display: grid; place-items: center; width: 34px; height: 34px; flex-shrink: 0; border-radius: 9px; overflow: hidden; background: #fff; box-shadow: 0 0 0 .5px var(--sep-strong), 0 1px 2px rgba(0, 0, 0, .06); }
.brand-mark img { width: 100%; height: 100%; object-fit: cover; }
.brand-mark b { font-size: 17px; font-weight: 800; color: #1d1d1f; }
.brand-name { font-size: 19px; font-weight: 700; letter-spacing: -.025em; }
.tb-brand { display: none; gap: 8px; padding: 0; }
.tb-brand .brand-mark { width: 26px; height: 26px; border-radius: 7px; }
.tb-brand .brand-name { font-size: 15px; }
.shell.side-closed .tb-brand { display: flex; }
.search { display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 10px; border-radius: 10px; background: var(--fill); color: var(--ink-2); }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: none; color: var(--ink); font-size: 15px; }
.search input::placeholder { color: var(--ink-2); }
.search kbd { font: 12px var(--font); color: var(--ink-3); }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 6px; }
.side-head h2 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.side-head h3 { font-size: 15px; font-weight: 700; }
.side-head .aside { font-size: 12.5px; color: var(--ink-2); text-align: right; }
.icon-btn { width: 30px; height: 30px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--fill); color: var(--accent); flex-shrink: 0; transition: background-color .15s; }
.icon-btn:hover { background: var(--sel); }
.icon-btn svg.i { width: 15px; height: 15px; stroke-width: 2.4; }
.icon-btn.plain { background: transparent; color: var(--ink-2); width: 32px; height: 32px; border-radius: 8px; }
.icon-btn.plain svg.i { width: 19px; height: 19px; stroke-width: 1.8; }
.icon-btn.plain:hover { background: var(--fill-2); color: var(--ink); }
.icon-btn.plain[aria-pressed="true"] { color: var(--accent); }

.summary { padding: 0 6px; }
.total { font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; margin-top: 2px; }
.delta { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; font-size: 14px; font-weight: 500; margin-top: 2px; }
.delta .muted { font-weight: 400; }
.label { font-size: 12.5px; color: var(--ink-2); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .axis { font: 11px var(--font); fill: var(--ink-2); letter-spacing: 0; }
.chart .grid { stroke: var(--sep); stroke-width: 1; shape-rendering: crispEdges; }
.chart .base { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 3; opacity: .6; }
.chart .mk { stroke: var(--sep-strong); stroke-width: 1; shape-rendering: crispEdges; }
.chart .mk-label { font: 600 10.5px var(--font); fill: var(--ink-2); }
.chart .cross { stroke: var(--ink-3); stroke-width: 1; shape-rendering: crispEdges; }
.tip { position: absolute; z-index: 5; pointer-events: none; padding: 7px 10px; border-radius: 10px; white-space: nowrap; background: var(--card); box-shadow: 0 4px 16px rgba(0, 0, 0, .14), 0 0 0 .5px var(--sep-strong); font-size: 12.5px; }
.tip .d { color: var(--ink-2); font-size: 11.5px; }
.range-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 0 6px; }
.range-delta { font-size: 12.5px; }

.seg { display: inline-flex; padding: 2px; gap: 0; background: var(--fill); border-radius: 9px; }
.seg button { height: 26px; padding: 0 11px; border: 0; border-radius: 7px; background: transparent; color: var(--ink); font-size: 13px; font-weight: 500; white-space: nowrap; transition: background-color .15s, box-shadow .15s; }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--seg-on); box-shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04); font-weight: 600; }
.seg .c { color: var(--ink-2); margin-left: 5px; font-weight: 400; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- home: fear & greed e torte */
.fg-slot { margin-top: 18px; }
.fg-body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px; align-items: center; margin-bottom: 12px; }
@container (max-width: 640px) { .fg-body { grid-template-columns: minmax(0, 1fr); gap: 16px; } }
svg.fg-gauge { display: block; width: 100%; max-width: 380px; height: auto; margin: 0 auto; }
svg.fg-gauge path { fill: var(--fill); }
svg.fg-gauge text { fill: var(--ink-2); font: 500 12px var(--font); }
svg.fg-gauge .fg-val { fill: var(--ink-3); font: 700 34px var(--font); }
.fg-hist > div { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--sep); }
.fg-hist > div:last-child { border-bottom: 0; }
.fg-hist dt { font-size: 13.5px; color: var(--ink-2); }
.fg-hist dd { margin: 0; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--ink-3); font-weight: 600; }
.home-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; align-items: start; }
.home-grid > * { min-width: 0; }
@container (max-width: 760px) { .home-grid { grid-template-columns: minmax(0, 1fr); } }
.ipie { display: grid; gap: 18px; justify-items: center; }
.pie.big { display: block; width: min(100%, 260px); height: auto; aspect-ratio: 1; overflow: visible; }
.slice { stroke: var(--card); stroke-width: 2; stroke-linejoin: round; cursor: pointer; outline: none; transition: transform 180ms var(--ease-out, ease-out), opacity 150ms ease; }
.slice:not([role]) { cursor: default; }
.slice[data-on] { transform: translate(var(--dx), var(--dy)); }
.ipie.hl .slice:not([data-on]) { opacity: .32; }
.slice:focus-visible { stroke: var(--accent); stroke-width: 3; }
.readout { width: 100%; min-height: 96px; padding: 12px 14px; border-radius: 12px; background: var(--card-2); }
.r-name { font-size: 15px; font-weight: 600; }
.r-name .muted { font-weight: 400; }
.r-big { font-size: 30px; font-weight: 700; letter-spacing: -.025em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.r-sub { font-size: 13px; color: var(--ink-2); }
.r-list { margin-top: 10px; border-top: 1px solid var(--sep); }
.r-list button { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; width: 100%; padding: 9px 0; border: 0; border-bottom: 1px solid var(--sep); background: none; text-align: left; font-size: 14px; }
.r-list li:last-child button { border-bottom: 0; }
.r-list span { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-list em { font-style: normal; font-weight: 600; font-variant-numeric: tabular-nums; }
.r-list svg.i { width: 13px; height: 13px; color: var(--ink-3); }
.ilegend { width: 100%; }
.ilegend li + li { border-top: 1px solid var(--sep); }
.ilegend .leg { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; width: 100%; padding: 9px 2px; border: 0; background: none; text-align: left; font-size: 14.5px; transition: opacity 150ms ease; }
.ilegend .leg:disabled { cursor: default; color: inherit; }
.ilegend .leg i { width: 10px; height: 10px; border-radius: 50%; }
.ilegend .leg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.ilegend .leg small { font-size: 13px; font-weight: 400; color: var(--ink-2); }
.ilegend .leg b { font-weight: 600; font-variant-numeric: tabular-nums; }
.ilegend .leg em { font-style: normal; color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; }
.ipie.hl .ilegend .leg:not([data-on]) { opacity: .45; }
.seg a { display: inline-flex; align-items: center; height: 26px; padding: 0 12px; border-radius: 7px; color: var(--ink); font-size: 13px; font-weight: 500; text-decoration: none; transition: background-color .15s, box-shadow .15s; }
.seg a[aria-current="page"] { background: var(--seg-on); box-shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04); font-weight: 600; }

/* anteprima notizie in stile notifiche (materiale traslucido, cresce dallo spicchio) */
.notif { position: fixed; z-index: 40; width: 290px; max-width: calc(100vw - 16px); padding: 8px; border-radius: 20px;
  background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
  box-shadow: 0 16px 40px rgba(0, 0, 0, .18), 0 0 0 .5px var(--sep-strong);
  opacity: 1; transform: scale(1); transition: opacity 160ms var(--ease-out, ease-out), transform 160ms var(--ease-out, ease-out); }
.notif[hidden] { display: block !important; visibility: hidden; pointer-events: none; opacity: 0; transform: scale(.96); transition: opacity 110ms ease, transform 110ms ease, visibility 0s linear 110ms; }
.notif.instant { transition: none; }
.nt-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 4px 8px 8px; font-size: 13px; }
.nt-head b span, .nt-head > span { color: var(--ink-2); font-weight: 400; }
.notif ul { display: grid; gap: 6px; }
.nt-card { padding: 10px 12px; border-radius: 14px; background: var(--card); box-shadow: 0 1px 2px rgba(0, 0, 0, .06); }
a.nt-art { display: block; color: inherit; text-decoration: none; transition: box-shadow 150ms ease, transform 120ms var(--ease-out, ease-out); }
@media (hover: hover) and (pointer: fine) { a.nt-art:hover { box-shadow: 0 2px 10px rgba(0, 0, 0, .12), 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); } a.nt-art:hover p { color: var(--accent); } }
a.nt-art:active { transform: scale(.985); }
.nt-meta { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); }
.nt-meta b { color: var(--ink); font-weight: 600; }
.nt-meta .chip { margin-left: auto; font-size: 12px; }
.nt-meta .chip svg.i { width: 11px; height: 11px; }
.nt-app { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; background: var(--ink); color: var(--card); font-size: 8px; font-weight: 800; letter-spacing: -.02em; }
.nt-card p { margin-top: 5px; font-size: 13.5px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nt-head .chip { font-size: 12.5px; }
.nt-rows > * { display: grid; grid-template-columns: 64px minmax(0, 1fr) 12px; gap: 10px; align-items: baseline; width: 100%; padding: 7px 6px; }
.nt-rows > * + * { border-top: 1px solid var(--sep); }
.nt-link { border: 0; background: none; text-align: left; color: inherit; border-radius: 8px; cursor: pointer; transition: background-color 120ms ease; }
.nt-link + .nt-link, .nt-link + .nt-row { border-top: 1px solid var(--sep); }
@media (hover: hover) and (pointer: fine) { .nt-link:hover { background: var(--fill-2); } .nt-link:hover .nt-k { color: var(--accent); } }
.nt-link svg.i { width: 12px; height: 12px; color: var(--ink-3); align-self: center; }
.nt-link:active { transform: scale(.985); }
.nt-k { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.nt-v { font-size: 13.5px; min-width: 0; }
.nt-v b { font-weight: 700; font-variant-numeric: tabular-nums; }
.nt-v .chip { font-size: 13px; }
/* arrivo dalla scheda: la sezione di destinazione si illumina un istante */
.card.flash { animation: flash 900ms var(--ease-out, ease-out); }
@keyframes flash { 0% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); } 100% { box-shadow: var(--shadow); } }
.nt-rows .nt-clamp { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nt-card p.nt-read { margin-top: 6px; font-size: 12.5px; font-weight: 400; font-style: italic; color: var(--ink-2); }
.nt-foot { padding: 8px 8px 3px; font-size: 12px; color: var(--ink-2); }
.chip.neg { color: var(--down); }
@media (prefers-reduced-transparency: reduce) { .notif { background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; } }

/* ---------------------------------------------------------------- fear & greed: quadrante in stile CNN */
.fg { margin-top: 18px; }
.fg .card-h { align-items: flex-start; }
.fg-now { font-size: 15px; font-weight: 700; white-space: nowrap; }
.fg-now.fear { color: var(--down); } .fg-now.greed { color: var(--up); } .fg-now.neutral { color: var(--ink-2); }
.fg .fg-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: center; margin: 0 0 12px; }
@container (max-width: 700px) { .fg .fg-body { grid-template-columns: minmax(0, 1fr); gap: 20px; } }
.fg-dial { display: block; width: 100%; max-width: 300px; height: auto; margin: 0 auto; overflow: visible; }
.fg-zone { fill: var(--card-2); stroke: none; }
.fg-zone.on { stroke-width: 1.5; }
.fg-zone.on.fear { fill: var(--down-soft); stroke: var(--down); }
.fg-zone.on.greed { fill: var(--up-soft); stroke: var(--up); }
.fg-zone.on.neutral { fill: var(--fill); stroke: var(--ink-3); }
.fg-zl { font: 700 12.5px var(--font); letter-spacing: .04em; fill: var(--ink-3); }
.fg-zl.on { fill: var(--ink); }
.fg-zl.tight { font-size: 11px; letter-spacing: .01em; }
.fg-dots circle { fill: var(--ink-3); opacity: .7; }
.fg-num { font: 500 14px var(--font); fill: var(--ink-2); }
.fg-needle { fill: var(--ink); }
.fg-hub { fill: var(--card); filter: drop-shadow(0 -1px 4px rgba(0, 0, 0, .08)); }
.fg-val { font: 700 34px var(--font); letter-spacing: -.03em; fill: var(--ink); }
.fg .fg-hist { display: grid; }
.fg .fg-hist > div { display: flex; align-items: center; gap: 10px; padding: 4px 0; border: 0; }
.fg .fg-hist dt { display: grid; gap: 0; font-size: 12px; color: var(--ink-2); line-height: 1.3; }
.fg .fg-hist dt b { font-size: 13.5px; font-weight: 700; color: var(--ink); }

/* ---------------------------------------------------------------- movimento (regole da emilkowalski/skills: apple-design, emil-design-eng) */
:root { --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1); }
html { -webkit-tap-highlight-color: transparent; }
/* risposta alla pressione: immediata, sottile */
.btn, .icon-btn, .link, .back, .seg button, .more button, .brow, .filter button { transition: transform 120ms var(--ease-out), background-color 150ms ease, box-shadow 150ms ease, filter 150ms ease; }
.btn:active, .icon-btn:active, .back:active, .seg button:active, .more button:active, .filter button:active { transform: scale(0.97); }
.sym { transition: transform 120ms var(--ease-out), background-color 120ms ease; }
.sym:active, .brow:active { transform: scale(0.985); }

@media not ((hover: hover) and (pointer: fine)) {
  .sym:not([aria-current]):hover, .brow:not([aria-pressed="true"]):hover, .icon-btn:hover { background: transparent; }
  .btn:hover { filter: none; }
}
/* cambio vista: dissolvenza breve dal basso, ease-out */

@keyframes view-in { from { opacity: 0; transform: translateY(6px); } }
/* foglio modale: centrato, entra da 0.96, esce più veloce */
dialog { transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out), overlay 200ms allow-discrete, display 200ms allow-discrete; }

@starting-style { dialog[open]::backdrop { background-color: rgba(0, 0, 0, 0); } }
.toast { transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
@starting-style { .toast { opacity: 0; transform: translate(-50%, 8px) scale(0.96); } }
.toast[hidden] { display: block !important; opacity: 0; transform: translate(-50%, 8px); pointer-events: none; transition-duration: 150ms; }
.meter i, .track i { transition: width 240ms var(--ease-out); }
/* barra degli strumenti: bordo solo quando il contenuto ci scorre sotto */
.toolbar { transition: box-shadow 200ms ease; }

/* tracking dipendente dalla dimensione */
body { letter-spacing: -0.005em; }
